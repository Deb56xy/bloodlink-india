name: Build Android App (APK & AAB for Google Play)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK & Google Play AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Release AAB (Google Play Store Bundle)
        working-directory: android
        run: gradle bundleRelease --stacktrace

      - name: Build Release APK (Direct Install for Testing)
        working-directory: android
        run: gradle assembleRelease --stacktrace

      - name: Upload Google Play AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: BloodLink-India-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: BloodLink-India-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
